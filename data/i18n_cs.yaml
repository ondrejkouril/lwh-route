  'Allemannsretten: up to 2 nights in one spot on uncultivated land, ≥150 m from houses/cabins; fire ban 15 Apr–15 Sep near forest.': 'Allemannsretten: až 2 noci na jednom místě na neobdělávané půdě, nejméně 150 m od domů a chat; od 15. 4. do 15. 9. platí u lesa zákaz rozdělávání ohně.'
  'Allemansrätten: 1–2 nights, out of sight of houses, not on farmland; respect local fire bans.': 'Allemansrätten: 1–2 noci, z dohledu domů, ne na zemědělské půdě; dodržujte místní zákazy rozdělávání ohně.'
  'Jokamiehenoikeus: short-term camping allowed away from homes; no open fire without landowner permission; NP campsites in Linnansaari.': 'Jokamiehenoikeus: krátkodobé táboření je povolené mimo obydlí; oheň jen se souhlasem vlastníka pozemku; v Linnansaari tábořiště národního parku.'
  'Use free RMK campsites/forest huts (rmk.ee); otherwise landowner permission needed.': 'Využijte bezplatná tábořiště a lesní chaty RMK (rmk.ee); jinde je potřeba souhlas vlastníka.'
  'Generally tolerated on public land away from houses; campsites recommended near Riga/Gauja NP.': 'Na veřejných pozemcích mimo obydlí se obvykle toleruje; u Rigy a v NP Gauja raději do kempu.'
  'Only at designated campsites/rest areas; wild camping in parks is fined.': 'Jen na vyhrazených tábořištích a odpočívkách; za táboření v parcích hrozí pokuta.'
  'No wild camping – use campsites or free shelters (shelter.dk / udinaturen.dk).': 'Táboření ve volné přírodě je zakázané – kempy nebo bezplatné přístřešky (shelter.dk / udinaturen.dk).'
  'No wild camping – campsites only.': 'Táboření ve volné přírodě je zakázané – jen kempy.'
  'Only on designated forest areas (''Zanocuj w lesie'' programme) or campsites.': 'Jen ve vyhrazených lesních oblastech (program „Zanocuj w lesie“) nebo v kempech.'

