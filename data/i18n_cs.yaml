  # day notes
  'Joins the LWH route ("Danish islands").': 'Napojení na trasu LWH („dánské ostrovy“).'
  'Use if the Lysefjord ferry is not running. Ride Lysevegen down and back up, then Sirdal → Fv45 Hunnedalen → Stavanger.': 'Pro případ, že trajekt přes Lysefjord nejede. Sjeďte Lysevegen dolů a zase nahoru, pak Sirdal → Fv45 Hunnedalen → Stavanger.'
  'LWH: "up to the Arctic Circle".': 'LWH: „až k polárnímu kruhu“.'
  'Easy day.': 'Pohodový den.'
  'Finnish–Russian border crossings are closed and the frontier zone needs a permit – stay on public roads to the museum.': 'Finsko-ruské hraniční přechody jsou zavřené a do hraničního pásma je potřeba povolení – k muzeu jeďte jen po veřejných silnicích.'
  'The old 488 km Raate → Savonlinna day, split at Koli.': 'Původně 488 km dlouhý den Raate → Savonlinna, rozdělený v Koli.'
  'Punkaharju ridge road and Olavinlinna, then the bike stays at the pier in Rantasalmi (Porosalmi); water taxi to Linnansaari NP. Optional log-rolling if available.': 'Hřebenová silnice Punkaharju a hrad Olavinlinna, pak motorka zůstane u mola v Rantasalmi (Porosalmi) a do NP Linnansaari se jede vodním taxi. Když bude příležitost, můžete zkusit log-rolling (balancování na plovoucím kmeni).'
  'Andøya National Tourist Route along the west coast (Bukkekjerka – Stave – Bleik). Short day – time for a whale safari from Andenes.': 'Národní turistická trasa Andøya podél západního pobřeží (Bukkekjerka – Stave – Bleik). Krátký den – z Andenes se dá vyrazit na pozorování velryb.'
  'Senja National Tourist Route (Fv86/Fv862) – narrow with blind bends, use the M passing places. Fill up before Senja – fuel is scarce on the outer coast.': 'Národní turistická trasa Senja (Fv86/Fv862) – úzká, s nepřehlednými zatáčkami, k míjení slouží výhybny označené M. Před Senjou natankujte – na vnějším pobřeží je pump málo.'
  'Tindevegen instead of the Fodnes–Mannheller ferry, Sogndal and Skjolden. Private toll road from Øvre Årdal over 1315 m to Turtagrø, where it joins Rv55 Sognefjellet.': 'Tindevegen místo trajektu Fodnes–Mannheller, Sogndalu a Skjoldenu. Soukromá placená silnice z Øvre Årdal přes 1315 m n. m. do Turtagrø, kde se napojí na Rv55 Sognefjellet.'
  'Adds the gravel Gamle Strynefjellsvegen (Fv258, Grotli → Videseter, hard-packed), then back east on Rv15 to the Geiranger road. Only if Fv258 is open – it has opened anywhere from mid-May to late June.': 'Přidává šotolinovou Gamle Strynefjellsvegen (Fv258, Grotli → Videseter, utužený povrch), pak zpět na východ po Rv15 k odbočce na Geiranger. Jen pokud je Fv258 otevřená – v minulých letech se otevírala kdykoli od poloviny května do konce června.'
  'Good point for family to fly in/out.': 'Dobré místo, kam může rodina přiletět nebo odkud odletět.'
  'Use it if Scandinavia costs you days. Same Helsinki–Tallinn ferry (many sailings a day, nothing else to book), then main roads through Riga, Kaunas and Warsaw.': 'Pro případ, že vás Skandinávie bude stát dny navíc. Stejný trajekt Helsinky–Tallinn (mnoho plaveb denně, nic dalšího se nerezervuje), pak po hlavních silnicích přes Rigu, Kaunas a Varšavu.'
  'Rest day.': 'Den odpočinku.'
  'Motoball club visit has no confirmed location – skipped.': 'Návštěva motobalového klubu nemá potvrzené místo – vynecháno.'
  'LWH stayed in a Lithuanian castle and took a balloon flight – castle unconfirmed. Balloon flights operate around Kaunas/Trakai.': 'V LWH přespali na litevském hradě a letěli balonem – hrad není potvrzený. Lety balonem se nabízejí kolem Kaunasu a Trakai.'
  'Avoid Kraków – A1 via Częstochowa and Ostrava.': 'Mimo Krakov – po A1 přes Čenstochovou a Ostravu.'

