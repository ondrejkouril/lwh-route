  # day notes
  'Joins the LWH route ("Danish islands").': 'Napojení na trasu LWH („dánské ostrovy“).'
  'Use if the Lysefjord ferry is not running. Ride Lysevegen down and back up, then Sirdal → Fv45 Hunnedalen → Stavanger.': 'Pro případ, že trajekt přes Lysefjord nejede. Sjeďte Lysevegen dolů a zase nahoru, pak Sirdal → Fv45 Hunnedalen → Stavanger.'
  'LWH: "up to the Arctic Circle".': 'LWH: „až k polárnímu kruhu“.'
  'Easy day.': 'Pohodový den.'
  'Finnish–Russian border crossings are closed and the frontier zone needs a permit – stay on public roads to the museum.': 'Finsko-ruské hraniční přechody jsou zavřené a do hraničního pásma je potřeba povolení – k muzeu jeďte jen po veřejných silnicích.'
  'The old 488 km Raate → Savonlinna day, split at Koli.': 'Původně 488 km dlouhý den Raate → Savonlinna, rozdělený v Koli.'
  'Punkaharju ridge road and Olavinlinna, then the bike stays at the pier in Rantasalmi (Porosalmi); water taxi to Linnansaari NP. Optional log-rolling if available.': 'Hřebenová silnice Punkaharju a hrad Olavinlinna, pak motorka zůstane u mola v Rantasalmi (Porosalmi) a do NP Linnansaari se jede vodním taxi. Když bude příležitost, můžete zkusit log-rolling (balancování na plovoucím kmeni).'
  'Andøya National Tourist Route along the west coast (Bukkekjerka – Stave – Bleik). Short day – time for a whale safari from Andenes.': 'Národní turistická trasa Andøya podél západního pobřeží (Bukkekjerka – Stave – Bleik). Krátký den – z Andenes se dá vyrazit na pozorování velryb.'
  'Senja National Tourist Route (Fv86/Fv862) – narrow with blind bends, use the M passing places. Fill up before Senja – fuel is scarce on the outer coast.': 'Národní turistická trasa Senja (Fv86/Fv862) – úzká, s nepřehlednými zatáčkami, k míjení slouží výhybny označené M. Před Senjou natankujte – na vnějším pobřeží je pump málo.'
  'Tindevegen instead of the Fodnes–Mannheller ferry, Sogndal and Skjolden. Private toll road from Øvre Årdal over 1315 m to Turtagrø, where it joins Rv55 Sognefjellet.': 'Tindevegen místo trajektu Fodnes–Mannheller, Sogndalu a Skjoldenu. Soukromá placená silnice z Øvre Årdal přes 1315 m n. m. do Turtagrø, kde se napojí na Rv55 Sognefjellet.'
  'Adds the gravel Gamle Strynefjellsvegen (Fv258, Grotli → Videseter, hard-packed), then back east on Rv15 to the Geiranger road. Only if Fv258 is open – it has opened anywhere from mid-May to late June.': 'Přidává šotolinovou Gamle Strynefjellsvegen (Fv258, Grotli → Videseter, utužený povrch), pak zpět na východ po Rv15 k odbočce na Geiranger. Jen pokud je Fv258 otevřená – v minulých letech se otevírala kdykoli od poloviny května do konce června.'
  'Good point for family to fly in/out.': 'Dobré místo, kam může rodina přiletět nebo odkud odletět.'
  'Use it if Scandinavia costs you days. Same Helsinki–Tallinn ferry (many sailings a day, nothing else to book), then main roads through Riga, Kaunas and Warsaw.': 'Pro případ, že vás Skandinávie bude stát dny navíc. Stejný trajekt Helsinky–Tallinn (mnoho plaveb denně, nic dalšího se nerezervuje), pak po hlavních silnicích přes Rigu, Kaunas a Varšavu.'
  'Rest day.': 'Den odpočinku.'
  'Motoball club visit has no confirmed location – skipped.': 'Návštěva motobalového klubu nemá potvrzené místo – vynecháno.'
  'LWH stayed in a Lithuanian castle and took a balloon flight – castle unconfirmed. Balloon flights operate around Kaunas/Trakai.': 'V LWH přespali na litevském hradě a letěli balonem – hrad není potvrzený. Lety balonem se nabízejí kolem Kaunasu a Trakai.'
  'Avoid Kraków – A1 via Częstochowa and Ostrava.': 'Mimo Krakov – po A1 přes Čenstochovou a Ostravu.'

  # day descriptions
  "Motorway transit. The one scenic stretch is the D8 through the České středohoří: volcanic cones on both sides of the Elbe at Lovosice before the climb over the Ore Mountains. Then flat Saxon and Brandenburg farmland to the Spreewald, a maze of tree-lined canals – take a punt ride in the evening.": "Přesun po dálnici. Jediný hezký úsek je D8 Českým středohořím: sopečné kopce po obou stranách Labe u Lovosic, pak stoupání přes Krušné hory. Dál rovinatá saská a braniborská pole až do Spreewaldu, bludiště kanálů lemovaných stromy – večer se svezte na pramici."
  "Fast roads to Rostock, two hours across the Baltic to Gedser, then the Danish islands: flat Lolland, the short ferry to Langeland and the South Funen archipelago. Look out from the bridges onto Tåsinge over Svendborgsund; small roads, thatched and half-timbered villages and sea on both sides.": "Rychle do Rostocku, dvě hodiny přes Baltské moře do Gedseru a pak dánské ostrovy: plochý Lolland, krátký trajekt na Langeland a souostroví jižního Fynu. Z mostů na Tåsinge je výhled na Svendborgsund; malé silnice, vesnice s doškovými a hrázděnými domy a moře po obou stranách."
  "A day of crossings: the 18 km Storebælt link high above the Great Belt, Zealand with its Viking sites, Copenhagen and the Øresund bridge-and-tunnel into Sweden – both bridges are the views of the day. Then Skåne farmland, the Bjäre peninsula at Båstad and the long sandy beach of Laholmsbukten.": "Den přejezdů: 18 km dlouhé spojení přes Velký Belt vysoko nad mořem, Sjælland s vikingskými místy, Kodaň a most s tunelem přes Öresund do Švédska – oba mosty jsou výhledem dne. Pak pole Skåne, poloostrov Bjäre u Båstadu a dlouhá písečná pláž Laholmsbukten."
  "Sweden's west coast: Varberg's fortress by the sea, Gothenburg, then Bohuslän – bare pink granite, skerries and red fishing huts. The side roads to Smögen and Fjällbacka are the highlight: narrow lanes between rocks and inlets and harbours full of boats. Into Norway over the high Svinesund bridge.": "Západní pobřeží Švédska: pevnost Varberg u moře, Göteborg a pak Bohuslän – holá růžová žula, šæry a červené rybářské boudy. Nejlepší jsou odbočky do Smögenu a Fjällbacky: úzké silničky mezi skalami a zátokami a přístavy plné lodí. Do Norska přes vysoký most Svinesund."
  "Into the mountains of Telemark: forested valleys via Kongsberg and Notodden, then Rv37 along the long, narrow Tinnsjø and up the steep Vestfjord valley to Rjukan, under the cone of Gaustatoppen (1,883 m). Past Vemork the road climbs onto open plateau with lakes, to the treeless Haukelifjell – expect snow patches in June.": "Do hor Telemarku: zalesněná údolí přes Kongsberg a Notodden, pak Rv37 podél dlouhého úzkého jezera Tinnsjø a strmým údolím Vestfjord do Rjukanu pod kuželem Gaustatoppenu (1 883 m). Za Vemorkem silnice vystoupá na otevřenou náhorní plošinu s jezery až na holé Haukelifjell – v červnu počítejte se sněhem."
  "The big mountain day of the south: down Setesdal along the Otra, then Suleskarvegen across a bare, lake-studded plateau with snow walls early in the season. Lysevegen crosses the same moonscape to Øygardstøl, then drops 900 m in 27 hairpins to Lysebotn. On the ferry out along the Lysefjord, Kjerag towers above the start and Preikestolen comes up on the right near the end.": "Velký horský den jihu: dolů údolím Setesdal podél Otry, pak Suleskarvegen přes holou planinu posetou jezery, brzy v sezóně mezi sněhovými stěnami. Lysevegen vede stejnou měsíční krajinou na Øygardstøl a pak klesá 900 m v 27 serpentinách do Lysebotnu. Z trajektu po Lysefjordu uvidíte na začátku nad sebou Kjerag a ke konci vpravo Preikestolen."
  "Ryfylke: under the fjords in the Ryfast tunnels, then Fv13 along the water and over the Hjelmeland ferry to Sauda. Saudafjellet climbs above the treeline to a bare plateau of lakes at about 960 m before dropping to Røldal. Then Hardanger: the Låtefoss twin waterfall right beside the road, and Sørfjorden lined with fruit orchards under the Folgefonna glacier, before the Hardanger Bridge.": "Ryfylke: pod fjordy tunely Ryfast, pak Fv13 podél vody a trajektem z Hjelmelandu do Saudy. Saudafjellet vystoupá nad hranici lesa na holou planinu s jezery ve výšce asi 960 m a klesá do Røldalu. Pak Hardanger: dvojitý vodopád Låtefoss hned u silnice a Sørfjorden lemovaný ovocnými sady pod ledovcem Folgefonna, než přijde most přes Hardangerfjord."
  "Fjord Norway at its most dramatic: the Stalheim view down the Nærøydalen gorge, the Viking Valley at the narrow Nærøyfjord, and the Stegastein platform 650 m above the Aurlandsfjord. Aurlandsfjellet crosses a barren snowy plateau to Lærdal and the side trip to Borgund. After the short Sognefjord ferry, Sognefjellet climbs from Skjolden to 1,434 m – northern Europe's highest pass – between the glaciers and peaks of Jotunheimen.": "Fjordové Norsko v nejlepší formě: pohled ze Stalheimu do soutěsky Nærøydalen, Vikingské údolí u úzkého Nærøyfjordu a vyhlídka Stegastein 650 m nad Aurlandsfjordem. Aurlandsfjellet vede přes holou zasněženou planinu do Lærdalu a na odbočku do Borgundu. Po krátkém trajektu přes Sognefjord stoupá Sognefjellet ze Skjoldenu do 1 434 m – nejvyšší silniční průsmyk severní Evropy – mezi ledovci a štíty Jotunheimenu."
  "The classic: Rv15 to Grotli, the Dalsnibba road (1,476 m) for the view straight down onto the Geirangerfjord, the hairpins down to Geiranger and up the Eagle Road for the other famous view. Then Trollstigen: eleven hairpins down a vertical valley wall beside the Stigfossen waterfall – stop at the platforms at the top first. Romsdalen's rock walls, a short ferry, and the Atlantic Road hopping between skerries in the open sea.": "Klasika: Rv15 do Grotli, silnice na Dalsnibbu (1 476 m) s výhledem přímo dolů na Geirangerfjord, serpentiny do Geirangeru a nahoru po Orlí silnici k druhé slavné vyhlídce. Pak Trollstigen: jedenáct serpentin dolů po svislé stěně údolí vedle vodopádu Stigfossen – nejdřív zastavte na vyhlídkách nahoře. Skalní stěny Romsdalenu, krátký trajekt a Atlantická silnice skákající po ostrůvcích na otevřeném moři."
  "A transfer inland: Rv70 up the deep, waterfall-lined Sunndalen, then the E6 from Oppdal down the Gauldal valley to Trondheim – Nidaros Cathedral and the coloured wharves on the Nidelva. Then farmland along the Trondheimsfjord to Steinkjer.": "Přesun do vnitrozemí: Rv70 hlubokým údolím Sunndalen plným vodopádů, pak E6 z Oppdalu údolím Gauldal do Trondheimu – katedrála Nidaros a barevná skladiště na řece Nidelva. Dál po polích podél Trondheimsfjordu do Steinkjeru."
  "The long E6 north through Namdalen and Helgeland: spruce and birch forest, wide salmon rivers, lakes and the first bare fells. Not a curvy day – make distance. Laksforsen waterfall beside the E6 before Mosjøen makes a good break, and Mosjøen's Sjøgata is a street of 19th-century wooden warehouses.": "Dlouhá E6 na sever přes Namdalen a Helgeland: smrkové a březové lesy, široké lososí řeky, jezera a první holé hory. Není to zatáčkový den – hlavně ujet kilometry. Dobrá zastávka je vodopád Laksforsen u E6 před Mosjøenem a ulice Sjøgata v Mosjøenu s dřevěnými sklady z 19. století."
  "The E6 climbs over Saltfjellet onto bare, windswept upland – the Arctic Circle Centre sits right on the line. Down through Saltdal to Saltstraumen, the world's strongest tidal current (it peaks every six hours – check the tide table), and Bodø. On the 3½-hour ferry the jagged wall of Lofoten grows on the horizon: stay on deck for the approach to Moskenes.": "E6 vystoupá přes Saltfjellet na holou větrnou vysočinu – Centrum polárního kruhu stojí přímo na čáře. Dolů údolím Saltdal k Saltstraumenu, nejsilnějšímu přílivovému proudu na světě (vrcholí každých šest hodin – podívejte se do tabulky přílivu), a do Bodø. Během 3½ hodiny na trajektu roste na obzoru zubatá stěna Lofot: při příjezdu do Moskenes buďte na palubě."
  "Lofoten on the E10: the bridges at Hamnøy and Sakrisøy with the postcard view of Reine, white beaches at Ramberg and Flakstad, the side road to Nusfjord. Then green farmland at Leknes and Borg, and the Henningsvær side road with granite peaks straight out of the sea. Short distance, lots of stopping – a day for photos.": "Lofoty po E10: mosty v Hamnøy a Sakrisøy s pohlednicovým výhledem na Reine, bílé pláže v Rambergu a Flakstadu, odbočka do Nusfjordu. Pak zelená pole u Leknes a Borgu a odbočka do Henningsværu se žulovými štíty rostoucími přímo z moře. Málo kilometrů, hodně zastávek – den na fotky."
  "Out of Lofoten over the Raftsund bridge and through Vesterålen to Sortland. The Andøya scenic route then follows the open west coast: bog and moor on one side, the Atlantic on the other, with sharp mountains around Bukkekjerka, Stave and Bleik. A short day – the afternoon is free for a whale safari from Andenes.": "Z Lofot přes most Raftsund a Vesterålen do Sortlandu. Vyhlídková trasa Andøya pak vede po otevřeném západním pobřeží: na jedné straně rašeliniště a vřesoviště, na druhé Atlantik, mezi tím ostré hory u Bukkekjerky, Stave a Bleiku. Krátký den – odpoledne je volné na vyjížďku za velrybami z Andenes."
  "Morning ferry across the Andfjord to Senja. Its scenic route along the outer coast is the best riding of the north: a narrow road and tunnels between steep peaks and deep fjords, the Bergsbotn platform over Bergsfjorden, and Tungeneset facing the jagged Okshornan ('Devil's Teeth'). A short ferry to Kvaløya, then into Tromsø.": "Ranní trajekt přes Andfjord na Senju. Její vyhlídková trasa po vnějším pobřeží je nejlepší jízda severu: úzká silnice a tunely mezi strmými štíty a hlubokými fjordy, vyhlídka Bergsbotn nad Bergsfjordem a Tungeneset naproti zubatým Okshornan („Ďáblovy zuby“). Krátký trajekt na Kvaløyu a do Tromsø."
  "The Lyngen Alps: two short ferries cut across Ullsfjorden and Lyngenfjorden, with glaciated peaks rising straight out of the sea – the Lyngseidet–Olderdalen crossing has the best view. Then the E6 around Kåfjord and over the Kvænangsfjellet plateau (viewpoint over the Kvænangen islands), past the Tirpitz Museum to Alta.": "Lyngenské Alpy: dva krátké trajekty přes Ullsfjorden a Lyngenfjorden, se zaledněnými štíty rostoucími přímo z moře – nejlepší výhled je z přejezdu Lyngseidet–Olderdalen. Pak E6 kolem Kåfjordu a přes planinu Kvænangsfjellet (vyhlídka na ostrovy Kvænangenu) kolem muzea Tirpitz do Alty."
  "Over Sennalandet: open, treeless tundra with lakes and Sámi reindeer – watch for them on the road. Down along the Porsangerfjord, then the North Cape tunnel 212 m under the sea to Magerøya. Ride the last stretch across bare tundra to Nordkapp late in the evening for the midnight sun over the Barents Sea.": "Přes Sennalandet: otevřená tundra bez stromů s jezery a sámskými soby – pozor na ně na silnici. Dolů podél Porsangerfjordu a tunelem Nordkapp 212 m pod mořem na ostrov Magerøya. Poslední úsek přes holou tundru na Nordkapp jeďte pozdě večer – kvůli půlnočnímu slunci nad Barentsovým mořem."
  "Back along the Porsangerfjord, then inland across Finnmarksvidda – birch scrub, wide river valleys and reindeer – to Karasjok, the Sámi capital. Into Finland at Karigasniemi and on through low fells and pine forest to Inari, on a vast lake of some 3,000 islands.": "Zpět podél Porsangerfjordu a pak vnitrozemím přes Finnmarksviddu – zakrslé břízy, široká říční údolí a sobi – do Karasjoku, hlavního města Sámů. Do Finska v Karigasniemi a dál přes nízké hory a borové lesy do Inari u obrovského jezera s asi 3 000 ostrovy."
  "South through Finnish Lapland on the E75: pine forest, the rounded fells of Saariselkä and big open bogs – reindeer on the road are almost certain. Long straight roads for cruising. Down the Kemijoki to Rovaniemi and the Arctic Circle line at Santa Claus Village.": "Na jih Finským Laponskem po E75: borové lesy, oblé hory Saariselkä a velká otevřená rašeliniště – sobi na silnici jsou skoro jistota. Dlouhé rovné silnice na pohodovou jízdu. Podél řeky Kemijoki do Rovaniemi a k čáře polárního kruhu ve Vesnici Santa Clause."
  "Through the forest heart of Finland: Ranua, then the empty roads of Koillismaa and Kainuu – pine and spruce, bogs and lakes, very little traffic. North of Suomussalmi, the Silent People: a field of about a thousand scarecrows by the road. End on the Raate road, the Winter War battlefield, at Raatteen Portti and its memorial of stones.": "Lesním srdcem Finska: Ranua a pak prázdné silnice Koillismaa a Kainuu – borovice a smrky, rašeliniště a jezera, skoro žádný provoz. Severně od Suomussalmi Tichý lid: pole s asi tisícem strašáků u silnice. Konec na silnici Raate, bojišti zimní války, u Raatteen Portti s památníkem z kamenů."
  "Quiet forest roads along the border region via Kuhmo and Nurmes, then Koli: the highest hills of eastern Finland, rising about 250 m above Lake Pielinen. The view from Ukko-Koli over the lake and its islands, best in the evening light, is a Finnish national landscape painted by the national-romantic artists.": "Klidné lesní silnice pohraničím přes Kuhmo a Nurmes a pak Koli: nejvyšší kopce východního Finska, asi 250 m nad jezerem Pielinen. Výhled z Ukko-Koli na jezero a ostrovy, nejlepší ve večerním světle, je finská národní krajina, kterou malovali národní romantici."
  "Through North Karelia's lakes to Punkaharju, where the ridge road follows a narrow pine-covered esker with water on both sides – ride it slowly. Then Olavinlinna, the 15th-century castle on an island in Savonlinna, and Rantasalmi pier for the boat to Linnansaari: rocky islands in Lake Haukivesi, home of the Saimaa ringed seal.": "Mezi jezery Severní Karélie do Punkaharju, kde hřebenová silnice vede po úzkém borovicovém ozu s vodou po obou stranách – jeďte pomalu. Pak Olavinlinna, hrad z 15. století na ostrově v Savonlinně, a molo v Rantasalmi, odkud pluje loď na Linnansaari: skalnaté ostrovy v jezeře Haukivesi, domov saimaanského tuleně kroužkovaného."
  "Saimaa's ridge roads via Sulkava and Puumala – bridges and narrow eskers between the lakes – then Mikkeli with its war museums, and faster roads south through Lahti to Helsinki.": "Hřebenové silnice Saimaa přes Sulkavu a Puumalu – mosty a úzké ozy mezi jezery – pak Mikkeli s válečnými muzei a rychlejší silnice na jih přes Lahti do Helsinek."
  "Morning ferry across the Gulf of Finland: Helsinki's islands and Suomenlinna on the way out, Tallinn's spires on arrival. Walk the medieval old town or see the Seaplane Harbour, then the flat, forested road south to Pärnu, Estonia's summer beach town.": "Ranní trajekt přes Finský záliv: cestou ven helsinské ostrovy a Suomenlinna, při příjezdu věže Tallinnu. Projděte si středověké Staré Město nebo Přístav hydroplánů a pak po rovině lesem na jih do Pärnu, estonského letoviska s plážemi."
  "A rest day on Kihnu: an hour on the ferry, then sandy tracks, juniper and pine, and a living island culture – women in striped skirts riding sidecar motorcycles. See the church and museum in Linaküla and the lighthouse at the southern tip. Leave the luggage in Pärnu.": "Den odpočinku na ostrově Kihnu: hodina na trajektu, pak písčité cesty, jalovce a borovice a živá ostrovní kultura – ženy v pruhovaných sukních na motorkách se sajdkárou. Kostel a muzeum v Linaküle a maják na jižním cípu. Zavazadla nechte v Pärnu."
  "Along the Gulf of Riga coast via Häädemeeste and Ainaži, then inland to the Gauja valley: sandstone cliffs and wooded slopes at Sigulda, Turaida Castle and the bobsleigh track. Riga's Art Nouveau quarter and old town in the evening.": "Podél pobřeží Rižského zálivu přes Häädemeeste a Ainaži, pak do vnitrozemí do údolí Gauja: pískovcové útesy a zalesněné svahy u Siguldy, hrad Turaida a bobová dráha. Večer secesní čtvrť a Staré Město v Rize."
  "West through Jūrmala's pine-lined beach resort, then rural Courland to Kuldīga: the Venta Rapid, Europe's widest waterfall, below an old brick bridge in a wooden town. Then Liepāja's Karosta naval port and the coast road south to Palanga's beach and amber.": "Na západ přes Jūrmalu, letovisko s borovicemi a plážemi, a venkovským Kuronskem do Kuldīgy: peřej Venta, nejširší vodopád Evropy, pod starým cihlovým mostem v dřevěném městečku. Pak válečný přístav Karosta v Liepāji a pobřežní silnice na jih k pláži a jantaru v Palanze."
  "Past Klaipėda into the Nemunas delta – flat polders and wetlands, with the island village of Rusnė as a side trip. Then the Panemunė road east along the Nemunas: villages on the bluff above the wide river, ending at Panemunė Castle.": "Kolem Klaipėdy do delty Němenu – ploché poldry a mokřady, s odbočkou do ostrovní vesnice Rusnė. Pak silnice Panemunė na východ podél Němenu: vesnice na srázu nad širokou řekou a na konci hrad Panemunė."
  "Transit through Lithuania and north-east Poland: Kaunas, then the forests and lakes around Augustów, before the S8 expressway to Warsaw.": "Přesun přes Litvu a severovýchodní Polsko: Kaunas, pak lesy a jezera kolem Augustówa a rychlostní silnice S8 do Varšavy."
  "Motorway home: the S8 and A1 south across the plains past Częstochowa, then Upper Silesia and the Moravian Gate at Ostrava, with the Beskydy on the horizon.": "Po dálnici domů: S8 a A1 na jih přes roviny kolem Čenstochové, pak Horní Slezsko a Moravská brána u Ostravy s Beskydy na obzoru."
  "If the Lysefjord ferry isn't running: ride Lysevegen's hairpins down to Lysebotn and back up, then Sirdal and Fv45 through Hunnedalen, a narrow valley between bare rock walls, to Stavanger.": "Pokud trajekt přes Lysefjord nejede: sjeďte serpentiny Lysevegenu do Lysebotnu a zase nahoru, pak přes Sirdal a Fv45 údolím Hunnedalen, úzkým údolím mezi holými skalními stěnami, do Stavangeru."
  "Instead of the ferry and Skjolden: along the Årdalsfjord to Øvre Årdal, then the private Tindevegen climbing above the treeline under the Hurrungane – Norway's most alpine peaks – to 1,315 m and down to Turtagrø on Sognefjellet.": "Místo trajektu a Skjoldenu: podél Årdalsfjordu do Øvre Årdal a pak soukromá Tindevegen nad hranici lesa pod Hurrungane – nejalpštější štíty Norska – do 1 315 m a dolů do Turtagrø na Sognefjellet."
  "Adds the gravel Gamle Strynefjellsvegen (1894): a hand-built road with stone walls through barren high mountains of lakes and snowfields, often between snow walls in June.": "Přidává šotolinovou Gamle Strynefjellsvegen (1894): ručně stavěnou silnici s kamennými zídkami holými horami s jezery a sněhovými poli, v červnu často mezi sněhovými stěnami."
  "Morning ferry to Tallinn, then the Via Baltica south: flat farmland and forest, Pärnu bay and the Gulf of Riga coast past Ainaži to Riga.": "Ranní trajekt do Tallinnu a pak Via Baltica na jih: rovinatá pole a lesy, Pärnuský záliv a pobřeží Rižského zálivu kolem Ainaži do Rigy."
  "Via Baltica through Latvian and Lithuanian farmland – Bauska, with Rundāle Palace close by, Panevėžys and the Kaunas ring road – into Poland and the lake town of Augustów.": "Via Baltica lotyšskou a litevskou zemědělskou krajinou – Bauska s nedalekým zámkem Rundāle, Panevėžys a obchvat Kaunasu – do Polska a jezerního městečka Augustów."
  "The S8 through the forests of Podlasie and Masovia, round Warsaw and across the plain to Piotrków Trybunalski.": "S8 lesy Podlesí a Mazovska, kolem Varšavy a po rovině do Piotrkówa Trybunalského."
  "The A1 south past Częstochowa, Upper Silesia and Ostrava, then home through the Moravian Gate.": "A1 na jih kolem Čenstochové, Horním Slezskem a kolem Ostravy a domů Moravskou branou."

