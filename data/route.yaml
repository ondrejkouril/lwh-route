# Long Way Home – Scandinavia & Baltics: single source of truth.
#
# Point fields
#   name, lat, lon, type (via|shape|poi|overnight|ferry_start|ferry_end), lwh, notes
#   geocode   : Nominatim query used to verify the coordinate (null = not a named place)
#   road      : road ref the point must sit on (verified against OSM via Overpass)
#   lwh_conf  : confirmed | likely   (only when lwh: true)
#   spur      : boat | dead-end | short  -> exempt from the 500 m LWH-on-track check
#   route     : false -> waypoint only, not routed through (default true)
#   override  : {lat, lon, reason} -> manual coordinate fix; wins over lat/lon
#
# Day fields
#   id, offset (days after departure), title, from, to, target_km, transit (motorway day),
#   overnight_type (wild camp | campsite cabin | hotel | home), country (overnight),
#   tolls, seasonal, ferries are derived from ferry_start/ferry_end points.

meta:
  name: Long Way Home – Scandinavia & Baltics
  start: Kobylnice, CZ
  bike: BMW R 1300 GS
  start_date: 2027-06-15     # departure (D01); rider: "middle of June"
  chosen_option: B           # B = Nordkapp + Andøya/Senja (30 riding days, no buffer); A = Swedish forest (27 + 3)
  trip_days: 30
  repo_url: https://github.com/ondrejkouril/lwh-route
  site_url: https://ondrejkouril.github.io/lwh-route

ferries:
  rostock-gedser:     {label: "Rostock–Gedser", operator: Scandlines, duration_h: 2.0, book: true}
  tars-spodsbjerg:    {label: "Tårs–Spodsbjerg", operator: "Molslinjen / Langelandsfærgen", duration_h: 0.75, book: false}
  lysebotn-stavanger: {label: "Lysebotn–Stavanger (Lysefjord, seasonal)", operator: "Kolumbus / Norled seasonal car ferry", duration_h: 3.5, book: true, seasonal: true}
  hjelmeland-nesvik:  {label: "Hjelmeland–Nesvik", operator: Norled, duration_h: 0.25, book: false}
  fodnes-mannheller:  {label: "Fodnes–Mannheller", operator: Fjord1, duration_h: 0.25, book: false}
  eidsdal-linge:      {label: "Eidsdal–Linge", operator: Fjord1, duration_h: 0.25, book: false}
  afarnes-solsnes:    {label: "Åfarnes–Sølsnes", operator: Fjord1, duration_h: 0.3, book: false, added: true}
  bodo-moskenes:      {label: "Bodø–Moskenes", operator: Torghatten Nord, duration_h: 3.5, book: true, critical: true}
  helsinki-tallinn:   {label: "Helsinki–Tallinn", operator: "Tallink Silja / Viking Line / Eckerö Line", duration_h: 2.0, book: true, lwh: true}
  munalaiu-kihnu:     {label: "Munalaiu–Kihnu", operator: Kihnu Veeteed, duration_h: 1.0, book: false, lwh: true}
  kihnu-munalaiu:     {label: "Kihnu–Munalaiu", operator: Kihnu Veeteed, duration_h: 1.0, book: false, lwh: true}
  breivikeidet-svensby: {label: "Breivikeidet–Svensby", operator: "Boreal Sjø", duration_h: 0.3, book: false}
  lyngseidet-olderdalen: {label: "Lyngseidet–Olderdalen", operator: "Boreal Sjø", duration_h: 0.7, book: false}
  andenes-gryllefjord: {label: "Andenes–Gryllefjord (Andøya–Senja, seasonal)", operator: "Svipper (Troms county ferries)", duration_h: 1.7, book: true, seasonal: true, added: true}
  botnhamn-brensholmen: {label: "Botnhamn–Brensholmen", operator: "Svipper (Troms county ferries)", duration_h: 0.75, book: false, added: true}

seasonal_roads:
  suleskarvegen:  {label: "Fv450 Suleskarvegen", typical: "usually opens around June"}
  lysevegen:      {label: "Fv500 Lysevegen", typical: "usually opens late May / June"}
  aurlandsfjellet: {label: "Fv243 Aurlandsfjellet (Snøvegen)", typical: "usually opens late May / June"}
  sognefjellet:   {label: "Rv55 Sognefjellet", typical: "usually opens May"}
  trollstigen:    {label: "Fv63 Trollstigen", typical: "usually opens late May"}
  geirangervegen: {label: "Fv63 Geiranger–Langvatn", typical: "usually opens May"}
  dalsnibba:      {label: "Nibbevegen (Dalsnibba summit road)", typical: "usually opens late May / June"}
  lysefjord_ferry: {label: "Lysefjord car ferry Lysebotn–Stavanger", typical: "summer timetable only", verify: "the ferry operator (Kolumbus)"}
  saudafjellet:   {label: "Fv520 Saudafjellet (Sauda–Røldal, ~960 m)", typical: "usually opens late May / June"}
  andenes_ferry:  {label: "Andenes–Gryllefjord ferry (Andøya–Senja)", typical: "summer only (2026 season: 13 May – 27 Sep)", verify: "the ferry operator (svipper.no / entur.no)"}
  strynefjellsvegen: {label: "Fv258 Gamle Strynefjellsvegen (gravel)", typical: "opening varies – past openings mid-May to late June"}
  tindevegen:     {label: "Tindevegen (Øvre Årdal – Turtagrø, 1315 m)", typical: "usually opens May"}

tolls:
  storebaelt: "Storebælt Bridge (DK) – pay at toll plaza / BroBizz"
  oresund:    "Øresund Bridge (DK–SE) – pay at toll plaza / BroBizz"
  ryfast:     "Ryfast tunnels (NO) – AutoPASS"
  autopass:   "Norway: register bike + card with AutoPASS for ferries & tolls (Ferjepass / EPC); motorcycles are exempt from many road tolls – verify current rules"
  dalsnibba:  "Nibbevegen to Dalsnibba summit – private toll road"
  tindevegen: "Tindevegen (Øvre Årdal – Turtagrø) – private automatic toll road, card payment"

# Optional light gravel from the Trans Euro Trail (TET Finland is mostly wide, hard-packed gravel).
# Not applied until the rider downloads the TET GPX into input/tet/ (TET terms forbid automated download and
# redistribution – input/tet/ is git-ignored). Each entry replaces one road leg if the TET passes both ends
# within 8 km and the gravel version is at most `max_detour` × the road leg.
gravel:
- {day: D17, from: "Suomussalmi (Ämmänsaari)", to: Raatteen Portti, file: fin.gpx, label: "Raate road (TET Finland)", max_detour: 2.5}
- {day: D18, from: Raatteen Portti, to: Kuhmo, file: fin.gpx, label: "Raate – Kuhmo border forests (TET Finland section 4)", max_detour: 1.6}
- {day: B18, from: Ivalo, to: Sodankylä, file: fin.gpx, label: "Lapland forest roads (TET Finland section 1)", max_detour: 1.5}

days:
