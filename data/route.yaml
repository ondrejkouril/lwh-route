- id: D07
  offset: 6
  title: Stavanger → Voss
  description: "Ryfylke: under the fjords in the Ryfast tunnels, then Fv13 along the water and over the Hjelmeland ferry to Sauda. Saudafjellet climbs above the treeline to a bare plateau of lakes at about 960 m before dropping to Røldal. Then Hardanger: the Låtefoss twin waterfall right beside the road, and Sørfjorden lined with fruit orchards under the Folgefonna glacier, before the Hardanger Bridge."
