# ---------------------------------------------------------------- Variant: home via Sweden (own itinerary tab)
# A complete alternative of the chosen trip: same days up to Nordkapp, then south through Swedish Lapland, the
# Inland Road and the mountain roads, night ferry Ystad → Świnoujście and motorways home through Poland and Czechia.
# Replaces the chosen trip from `replaces_from` (YAML id) on; offsets count from that day.
# Built into out/sweden/ (its own itinerary, map and day files) and linked as a tab from the main itinerary.
variant:
  id: sweden
  tab: Home via Sweden
  title: Long Way Home – home via Sweden
  replaces_from: B17
  lede: "Through Denmark, the Swedish west coast and the Norwegian fjords, up the coast to Lofoten, Andøya, Senja and Nordkapp, then south through Sámi Lapland, the Swedish Inland Road and the mountain roads of Lapland and Jämtland, across Dalarna, Värmland and Småland to a night ferry from Ystad, and home on the motorway through Poland."
  notes: "From Nordkapp home through Sweden: Vildmarksvägen, Flatruet, Karlsborg and the Göta Canal, a night ferry Ystad → Świnoujście, then motorways via the Międzyrzecz bunkers. One day shorter than the Finland and Baltics route."
  days:
  - id: V01
    offset: 0
    title: Nordkapp → Karasjok → Kautokeino
    description: "Back along the Porsangerfjord to Lakselv, then inland over Finnmarksvidda: birch scrub, wide river valleys and reindeer. Karasjok, the Sámi capital, and on across the plateau to Kautokeino, the other Sámi town of the north."
    from: Honningsvåg
    to: Kautokeino
    target_km: 370
    overnight_type: campsite cabin
    country: NO
    points:
    - {name: Honningsvåg, lat: 70.98, lon: 25.97, type: via, lwh: false, geocode: "Honningsvåg"}
    - {name: Olderfjord, lat: 70.474, lon: 25.07, override: {lat: 70.49424, lon: 25.04236, reason: "snapped onto E 69 (OSRM), was 2.47 km off"}, type: shape, lwh: false, road: E 69, geocode: "Olderfjord"}
    - {name: Lakselv, lat: 70.05, lon: 24.97, type: via, lwh: false, geocode: "Lakselv"}
    - {name: Karasjok, lat: 69.47, lon: 25.51, override: {lat: 69.47259, lon: 25.50288, reason: "moved 0.4 km onto the through-route to avoid a town-centre U-turn"}, type: via, lwh: false, geocode: "Karasjok"}
    - {name: Sápmi Park, lat: 69.4731, lon: 25.50709, type: poi, route: false, lwh: false, geocode: "Sápmi Park", notes: "Sámi culture park in Karasjok"}
    - {name: Kautokeino, lat: 69.01, lon: 23.04, type: overnight, lwh: false, geocode: "Kautokeino", notes: "Campsite cabin"}

