  description: "The classic: Rv15 to Grotli, the Dalsnibba road (1,476 m) for the view straight down onto the Geirangerfjord, the hairpins down to Geiranger and up the Eagle Road for the other famous view. Then Trollstigen: eleven hairpins down a vertical valley wall beside the Stigfossen waterfall – stop at the platforms at the top first. Romsdalen's rock walls, a short ferry, and the Atlantic Road hopping between skerries in the open sea."
