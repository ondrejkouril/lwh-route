- id: D08
  offset: 7
  title: Voss → Lom
  description: "Fjord Norway at its most dramatic: the Stalheim view down the Nærøydalen gorge, the Viking Valley at the narrow Nærøyfjord, and the Stegastein platform 650 m above the Aurlandsfjord. Aurlandsfjellet crosses a barren snowy plateau to Lærdal and the side trip to Borgund. After the short Sognefjord ferry, Sognefjellet climbs from Skjolden to 1,434 m – northern Europe's highest pass – between the glaciers and peaks of Jotunheimen."
  from: Voss
  to: Lom
  target_km: 340
  overnight_type: wild camp
  country: NO
  seasonal: [aurlandsfjellet, sognefjellet]
  alt_file: D08_alt
