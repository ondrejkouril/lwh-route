  - {name: Leknes, lat: 68.148, lon: 13.61, override: {lat: 68.14281, lon: 13.60955, reason: "snapped onto E 10 (OSRM), was 0.58 km off"}, type: shape, lwh: false, road: E 10, geocode: "Leknes", notes: E10}
  - {name: Lofotr Viking Museum, lat: 68.24423, lon: 13.75695, type: poi, route: false, lwh: false, geocode: "Lofotr Viking Museum", notes: "Reconstructed Viking chieftain's longhouse at Borg, beside the E10"}
  - {name: Henningsvær, lat: 68.15, lon: 14.20, type: poi, lwh: false, spur: dead-end, geocode: "Henningsvær", notes: Out-and-back spur on Fv816}
  - {name: Lofoten War Memorial Museum, lat: 68.23116, lon: 14.56482, type: poi, route: false, lwh: false, geocode: "Lofoten Krigsminnemuseum", notes: "Military: WWII collection (Operation Claymore raid, uniforms, Tirpitz relics) in Svolvær"}
