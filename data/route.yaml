# Long Way Home – Scandinavia & Baltics: single source of truth.
#
# Point fields
#   name, lat, lon, type (via|shape|poi|overnight|ferry_start|ferry_end), lwh, notes
#   geocode   : Nominatim query used to verify the coordinate (null = not a named place)
#   road      : road ref the point must sit on (verified against OSM via Overpass)
#   lwh_conf  : confirmed | likely   (only when lwh: true)
#   spur      : boat | dead-end | short  -> exempt from the 500 m LWH-on-track check
#   route     : false -> waypoint only, not routed through (default true)
#   override  : {lat, lon, reason} -> manual coordinate fix; wins over lat/lon
#
# Day fields
#   id, offset (days after departure), title, from, to, target_km, transit (motorway day),
#   overnight_type (wild camp | campsite cabin | hotel | home), country (overnight),
#   tolls, seasonal, ferries are derived from ferry_start/ferry_end points.

meta:
  name: Long Way Home – Scandinavia & Baltics
  start: Kobylnice, CZ
  bike: BMW R 1300 GS
  start_date: 2027-06-15     # departure (D01); rider: "middle of June"
  chosen_option: B           # B = Nordkapp + Andøya/Senja (30 riding days, no buffer); A = Swedish forest (27 + 3)
  trip_days: 30
  repo_url: https://github.com/ondrejkouril/lwh-route
  site_url: https://ondrejkouril.github.io/lwh-route
  private_repo_url: https://github.com/ondrejkouril/lwh-route-tet   # private submodule private/: TET gravel day files (links work for accounts with access)
  tab: Home via Finland & the Baltics   # itinerary tab of the chosen trip; `variant:` below gets its own tab

ferries:
  rostock-gedser:     {label: "Rostock–Gedser", operator: Scandlines, duration_h: 2.0, book: true}
  tars-spodsbjerg:    {label: "Tårs–Spodsbjerg", operator: "Molslinjen / Langelandsfærgen", duration_h: 0.75, book: false}
  lysebotn-stavanger: {label: "Lysebotn–Stavanger (Lysefjord, seasonal)", operator: "Kolumbus / Norled seasonal car ferry", duration_h: 3.5, book: true, seasonal: true}
  hjelmeland-nesvik:  {label: "Hjelmeland–Nesvik", operator: Norled, duration_h: 0.25, book: false}
  fodnes-mannheller:  {label: "Fodnes–Mannheller", operator: Fjord1, duration_h: 0.25, book: false}
  eidsdal-linge:      {label: "Eidsdal–Linge", operator: Fjord1, duration_h: 0.25, book: false}
  afarnes-solsnes:    {label: "Åfarnes–Sølsnes", operator: Fjord1, duration_h: 0.3, book: false, added: true}
  bodo-moskenes:      {label: "Bodø–Moskenes", operator: Torghatten Nord, duration_h: 3.5, book: true, critical: true}
  helsinki-tallinn:   {label: "Helsinki–Tallinn", operator: "Tallink Silja / Viking Line / Eckerö Line", duration_h: 2.0, book: true, lwh: true}
  munalaiu-kihnu:     {label: "Munalaiu–Kihnu", operator: Kihnu Veeteed, duration_h: 1.0, book: false, lwh: true}
  kihnu-munalaiu:     {label: "Kihnu–Munalaiu", operator: Kihnu Veeteed, duration_h: 1.0, book: false, lwh: true}
  breivikeidet-svensby: {label: "Breivikeidet–Svensby", operator: "Boreal Sjø", duration_h: 0.3, book: false}
  lyngseidet-olderdalen: {label: "Lyngseidet–Olderdalen", operator: "Boreal Sjø", duration_h: 0.7, book: false}
  andenes-gryllefjord: {label: "Andenes–Gryllefjord (Andøya–Senja, seasonal)", operator: "Svipper (Troms county ferries)", duration_h: 1.7, book: true, seasonal: true, added: true}
  botnhamn-brensholmen: {label: "Botnhamn–Brensholmen", operator: "Svipper (Troms county ferries)", duration_h: 0.75, book: false, added: true}
  ystad-swinoujscie:  {label: "Ystad–Świnoujście (night ferry)", operator: "Polferries / Unity Line", duration_h: 7.5, book: true}

seasonal_roads:
  suleskarvegen:  {label: "Fv450 Suleskarvegen", typical: "usually opens around June"}
  lysevegen:      {label: "Fv500 Lysevegen", typical: "usually opens late May / June"}
  aurlandsfjellet: {label: "Fv243 Aurlandsfjellet (Snøvegen)", typical: "usually opens late May / June"}
  sognefjellet:   {label: "Rv55 Sognefjellet", typical: "usually opens May"}
  trollstigen:    {label: "Fv63 Trollstigen", typical: "usually opens late May"}
  geirangervegen: {label: "Fv63 Geiranger–Langvatn", typical: "usually opens May"}
  dalsnibba:      {label: "Nibbevegen (Dalsnibba summit road)", typical: "usually opens late May / June"}
  lysefjord_ferry: {label: "Lysefjord car ferry Lysebotn–Stavanger", typical: "summer timetable only", verify: "the ferry operator (Kolumbus)"}
  saudafjellet:   {label: "Fv520 Saudafjellet (Sauda–Røldal, ~960 m)", typical: "usually opens late May / June"}
  andenes_ferry:  {label: "Andenes–Gryllefjord ferry (Andøya–Senja)", typical: "summer only (2026 season: 13 May – 27 Sep)", verify: "the ferry operator (svipper.no / entur.no)"}
  strynefjellsvegen: {label: "Fv258 Gamle Strynefjellsvegen (gravel)", typical: "opening varies – past openings mid-May to late June"}
  tindevegen:     {label: "Tindevegen (Øvre Årdal – Turtagrø, 1315 m)", typical: "usually opens May"}
  vildmarksvagen: {label: "Vildmarksvägen over Stekenjokk (≈ 870 m)", typical: "closed mid-October to early June", verify: "trafikverket.se"}

tolls:
  storebaelt: "Storebælt Bridge (DK) – pay at toll plaza / BroBizz"
  oresund:    "Øresund Bridge (DK–SE) – pay at toll plaza / BroBizz"
  ryfast:     "Ryfast tunnels (NO) – AutoPASS"
  autopass:   "Norway: register bike + card with AutoPASS for ferries & tolls (Ferjepass / EPC); motorcycles are exempt from many road tolls – verify current rules"
  dalsnibba:  "Nibbevegen to Dalsnibba summit – private toll road"
  tindevegen: "Tindevegen (Øvre Årdal – Turtagrø) – private automatic toll road, card payment"

# Optional light gravel from the Trans Euro Trail (TET Finland is mostly wide, hard-packed gravel).
# Applied only by `route --tet` / `build --tet`, with the rider's own TET GPX in input/tet/ (TET terms forbid automated
# download and redistribution – input/tet/, data/routed_tet/ and out_tet/ are git-ignored; out/ stays road-only).
# Each entry replaces one road leg (or its part between `join` and `leave`, where the TET meets the road) if the TET
# passes within 8 km of both and the gravel version is at most `max_detour` × the road leg.
# Checked against TET Finland 2026-09-23 (surface from OSM via BRouter way tags).
gravel:
- {day: D17, from: "Suomussalmi (Ämmänsaari)", to: Raatteen Portti, join: [64.8527, 29.2228], file: fin.gpx, label: "Raate road (TET Finland section 8)", max_detour: 1.6}   # TET shares the road until here, then ≈8 km of the old Raate road
- {day: D18, from: Raatteen Portti, to: Kuhmo, join: [64.666, 29.705], leave: [64.396, 29.862], file: fin.gpx, label: "Lentiira border forests (TET Finland section 4)", max_detour: 1.6}   # 48 km for 34 km of road, ≈26 unpaved
- {day: B17, from: Karasjok, to: Inari, join: [69.386, 25.851], leave: [68.926, 26.924], file: fin.gpx, label: "Karigasniemi – Inari forest road (TET Finland section 7)", max_detour: 1.5}   # 116 km for 94 km of road, ≈89 compacted gravel
# Not used: TET Finland does not run Ivalo → Sodankylä (section 7 goes Inari → Rovaniemi in one ≈380 km wilderness line).
# TET Sweden (`swe.gpx`, version 2026-08-01): only where the road is dull. The trail runs ≈ 10–20 km beside the towns, so
# each leg gets road connectors to `join` and from `leave` (points on the TET). D25 (Klarälven) stays on the road.
- {day: V09, from: Kristinehamn, to: Töreboda, join: [59.3219, 14.137], leave: [58.8222, 14.3877], file: swe.gpx, label: "Tiveden forests (TET Sweden S-02)", max_detour: 2.1}   # 159 km for 79 km of road, ≈121 gravel
- {day: V09, from: Karlsborg, to: Hjo, join: [58.4854, 14.3086], leave: [58.3246, 14.2894], file: swe.gpx, label: "Karlsborg – Hjo (TET Sweden S-02)", max_detour: 1.7}   # 54 km for 33 km of road, ≈30 gravel
- {day: V10, from: Hässleholm, to: Kåseberga, join: [56.0861, 14.1852], leave: [55.5281, 14.0968], file: swe.gpx, label: "Skåne ridges (TET Sweden S-23)", max_detour: 1.4}   # 149 km for 114 km of road, ≈90 gravel
# Tried and not used: D25 Malung → Ekshärad (S-14) and Ekshärad → Karlstad (S-02/S-18) – mostly connectors or replace the Klarälven;
# D26 Karlstad → Kristinehamn (S-02, 99 km for 43); D27 Jönköping → Växjö (S-01, 206 km for 135 – the ferry day would be ≈ 490 km).

days:
# ---------------------------------------------------------------- transit
- id: D01
  chapter: Riding north to the Danish islands
  offset: 0
  title: Kobylnice → Spreewald
  description: "Motorway transit. The one scenic stretch is the D8 through the České středohoří: volcanic cones on both sides of the Elbe at Lovosice before the climb over the Ore Mountains. Then flat Saxon and Brandenburg farmland to the Spreewald, a maze of tree-lined canals – take a punt ride in the evening."
  from: Kobylnice
  to: Spreewald
  target_km: 500
  transit: true
  overnight_type: campsite cabin
  country: DE
  points:
  - {name: Kobylnice, lat: 49.137, lon: 16.733, type: via, lwh: false, geocode: "Kobylnice, okres Brno-venkov", notes: Start}
  - {name: D1 Velké Meziříčí, lat: 49.345, lon: 16.02, override: {lat: 49.33121, lon: 16.07099, reason: "snapped onto D1 (OSRM), was 4.00 km off"}, type: shape, lwh: false, road: D1, notes: D1 motorway}
  - {name: D8 Lovosice, lat: 50.52, lon: 14.04, override: {lat: 50.51151, lon: 14.02695, reason: "snapped onto D8 (OSRM), was 1.32 km off"}, type: shape, lwh: false, road: D8, notes: D8 → A17 Dresden}
  - {name: A13 Ruhland, lat: 51.40, lon: 13.78, override: {lat: 51.4011, lon: 13.778, reason: "snapped onto A 13 (OSRM), was 0.19 km off"}, type: shape, lwh: false, road: A 13, notes: A13 Dresden → Berlin}
  - {name: Lübbenau/Spreewald, lat: 51.866, lon: 13.966, type: overnight, lwh: false, geocode: "Lübbenau/Spreewald", notes: "Campsite cabin, e.g. Spreewald-Natur-Camping am Schlosspark"}

- id: D02
  offset: 1
  title: Spreewald → Faaborg
  description: "Fast roads to Rostock, two hours across the Baltic to Gedser, then the Danish islands: flat Lolland, the short ferry to Langeland and the South Funen archipelago. Look out from the bridges onto Tåsinge over Svendborgsund; small roads, thatched and half-timbered villages and sea on both sides."
  from: Spreewald
  to: Faaborg
  target_km: 440
  transit: true
  overnight_type: hotel
  country: DK
  notes: Joins the LWH route ("Danish islands").
  points:
  - {name: Lübbenau/Spreewald, lat: 51.866, lon: 13.966, type: via, lwh: false, geocode: "Lübbenau/Spreewald"}
  - {name: Rostock Shipbuilding and Maritime Museum, lat: 54.1417, lon: 12.08671, type: poi, route: false, lwh: false, geocode: "Schifffahrtsmuseum Rostock", notes: "Maritime: museum aboard the freighter Dresden by the Warnow, 1 km off the route to the ferry"}
  - {name: Rostock Seehafen ferry terminal, lat: 54.152, lon: 12.106, override: {lat: 54.15267, lon: 12.10113, reason: "snapped to OSM ferry terminal"}, type: ferry_start, ferry: rostock-gedser, lwh: false, geocode: "Fährterminal Rostock", notes: "Scandlines Rostock–Gedser, ≈2 h, book ahead"}
  - {name: Gedser ferry port, lat: 54.576, lon: 11.928, override: {lat: 54.57374, lon: 11.92463, reason: "snapped to OSM ferry terminal"}, type: ferry_end, ferry: rostock-gedser, lwh: false, geocode: "Gedser"}
  - {name: Maribo, lat: 54.775, lon: 11.50, type: shape, lwh: false, geocode: "Maribo", notes: Across Lolland}
  - {name: Tårs ferry port, lat: 54.876, lon: 11.017, override: {lat: 54.87619, lon: 11.0294, reason: "snapped to OSM ferry terminal"}, type: ferry_start, ferry: tars-spodsbjerg, lwh: false, geocode: "Tårs Færgehavn", notes: "Tårs–Spodsbjerg ≈45 min, walk-up"}
  - {name: Spodsbjerg ferry port, lat: 54.93502, lon: 10.83312, type: ferry_end, ferry: tars-spodsbjerg, lwh: false, geocode: "Spodsbjerg"}
  - {name: Rudkøbing, lat: 54.937, lon: 10.71, override: {lat: 54.94466, lon: 10.71866, reason: "moved 1.0 km onto the through-route to avoid a town-centre U-turn"}, type: via, lwh: false, geocode: "Rudkøbing", notes: Langeland}
  - {name: Bregninge (Tåsinge), lat: 55.01, lon: 10.61, type: shape, lwh: false, geocode: "Bregninge, Tåsinge", notes: Tåsinge}
  - {name: Svendborg, lat: 55.060, lon: 10.607, override: {lat: 55.05402, lon: 10.59353, reason: "moved 1.1 km onto the through-route to avoid a town-centre U-turn"}, type: via, lwh: false, geocode: "Svendborg"}
  - {name: Faaborg, lat: 55.095, lon: 10.242, type: via, lwh: false, geocode: "Faaborg"}
  - {name: Hvedholm Slotshotel, lat: 55.07, lon: 10.17, override: {lat: 55.10516, lon: 10.18772, reason: "Nominatim 'Hvedholm Slot'; plan approx. was 4.1 km off"}, type: overnight, lwh: true, lwh_conf: confirmed, geocode: "Hvedholm Slot", notes: "LWH overnight. Alternative: Faaborg campsite cabin"}

# ---------------------------------------------------------------- Denmark → Sweden
- id: D03
  chapter: Denmark and the Swedish west coast
  offset: 2
  title: Faaborg → Tvååker
  description: "A day of crossings: the 18 km Storebælt link high above the Great Belt, Zealand with its Viking sites, Copenhagen and the Øresund bridge-and-tunnel into Sweden – both bridges are the views of the day. Then Skåne farmland, the Bjäre peninsula at Båstad and the long sandy beach of Laholmsbukten."
  from: Faaborg
  to: Tvååker
  target_km: 450
  overnight_type: hotel
  country: SE
  tolls: [storebaelt, oresund]
  points:
  - {name: Hvedholm Slotshotel, lat: 55.07, lon: 10.17, override: {lat: 55.10516, lon: 10.18772, reason: "Nominatim 'Hvedholm Slot'; plan approx. was 4.1 km off"}, type: via, lwh: true, lwh_conf: confirmed, geocode: "Hvedholm Slot"}
  - {name: Odense, lat: 55.40, lon: 10.39, override: {lat: 55.35036, lon: 10.46116, reason: "moved 7.1 km onto the through-route (pass-through town; centre caused a U-turn)"}, type: via, lwh: false, geocode: "Odense"}
  - {name: Ladby Viking ship, lat: 55.4435, lon: 10.61699, type: poi, route: false, lwh: false, geocode: "Vikingemuseet Ladby", notes: "Viking: Denmark's only Viking ship burial, 10 km off the E20 near Kerteminde"}
  - {name: Storebælt Bridge (toll), lat: 55.3343, lon: 10.9778, type: poi, route: false, lwh: false, notes: "Toll. Only fixed link Funen–Zealand, so no shaping point needed (a shaping point on the dual carriageway caused U-turns)"}
  - {name: Trelleborg ring fortress, lat: 55.39409, lon: 11.26527, type: poi, route: false, lwh: false, geocode: "Trelleborg, Slagelse", notes: "Viking: Harald Bluetooth's ring fortress (c. 980), UNESCO, 3 km off the E20 at Slagelse"}
  - {name: Viking Ship Museum Roskilde, lat: 55.65087, lon: 12.08147, type: poi, route: false, lwh: false, geocode: "Vikingeskibsmuseet, Roskilde", notes: "Viking: the five Skuldelev ships and a working boatyard, 13 km off the E20"}
  - {name: Little Mermaid (Copenhagen), lat: 55.693, lon: 12.599, spur: short, type: poi, lwh: false, geocode: "Den lille Havfrue", notes: Quick stop}
  - {name: Øresund Bridge (toll), lat: 55.56947, lon: 12.85529, type: poi, route: false, lwh: false, geocode: "Øresundsbron", notes: "Toll. Only fixed link Copenhagen–Malmö"}
  - {name: Malmö, lat: 55.605, lon: 13.00, type: via, lwh: true, lwh_conf: confirmed, geocode: "Malmö", notes: LWH city; biker club visit skipped}
  - {name: Båstad, lat: 56.43, lon: 12.85, spur: short, type: via, lwh: false, geocode: "Båstad"}
  - {name: Mellbystrand, lat: 56.508, lon: 12.948, override: {lat: 56.50684, lon: 12.96085, reason: "moved 0.8 km onto the through-route to avoid a town-centre U-turn"}, type: shape, lwh: false, geocode: "Mellbystrand", notes: Coast road along Laholmsbukten}
  - {name: Strömma Farmlodge, lat: 57.04, lon: 12.40, override: {lat: 57.05708, lon: 12.42522, reason: "user-supplied location (2026-10-13)"}, type: overnight, lwh: true, lwh_conf: confirmed, geocode: "Strömma, Tvååker", notes: LWH overnight}

- id: D04
  offset: 3
  title: Tvååker → Oslo
  description: "Sweden's west coast: Varberg's fortress by the sea, Gothenburg, then Bohuslän – bare pink granite, skerries and red fishing huts. The side roads to Smögen and Fjällbacka are the highlight: narrow lanes between rocks and inlets and harbours full of boats. Into Norway over the high Svinesund bridge."
  from: Tvååker
  to: Oslo
  target_km: 420
  overnight_type: hotel
  country: NO
  points:
  - {name: Strömma Farmlodge, lat: 57.04, lon: 12.40, override: {lat: 57.05708, lon: 12.42522, reason: "user-supplied location (2026-10-13)"}, type: via, lwh: true, lwh_conf: confirmed, geocode: "Strömma, Tvååker"}
  - {name: Varberg, lat: 57.106, lon: 12.250, type: via, lwh: false, geocode: "Varberg"}
  - {name: Varberg Fortress, lat: 57.10604, lon: 12.24001, type: poi, route: false, lwh: false, geocode: "Varbergs fästning", notes: "13th-century fortress by the sea in Varberg"}
  - {name: Maritiman, lat: 57.70944, lon: 11.96047, type: poi, route: false, lwh: false, geocode: "Maritiman", notes: "Maritime/military: floating museum – destroyer Småland and submarine Nordkaparen, 2 km off the E6 in Gothenburg"}
  - {name: E6 Kungälv, lat: 57.87, lon: 11.98, override: {lat: 57.83676, lon: 12.00598, reason: "snapped onto E 6 (OSRM), was 4.00 km off"}, type: shape, lwh: false, road: E 6, notes: Gothenburg passed on E6}
  - {name: Smögen, lat: 58.354, lon: 11.222, spur: dead-end, type: shape, lwh: false, geocode: "Smögen", notes: Bohuslän coast}
  - {name: Fjällbacka, lat: 58.599, lon: 11.287, type: shape, lwh: false, geocode: "Fjällbacka", notes: Bohuslän coast}
  - {name: Svinesund Bridge, lat: 59.095, lon: 11.26, override: {lat: 59.09473, lon: 11.25188, reason: "snapped onto E 6 (OSRM), was 0.46 km off"}, type: shape, lwh: false, road: E 6, notes: SE/NO border}
  - {name: Halden, lat: 59.12, lon: 11.39, override: {lat: 59.12385, lon: 11.27081, reason: "moved 6.8 km onto the through-route (pass-through town; centre caused a U-turn)"}, type: via, lwh: false, geocode: "Halden"}
  - {name: Fredriksten Fortress, lat: 59.1199, lon: 11.39686, type: poi, route: false, lwh: false, geocode: "Fredriksten festning", notes: "17th-century fortress above Halden, 7 km off the E6"}
  - {name: Akershus Fortress museums, lat: 59.9078, lon: 10.73576, type: poi, route: false, lwh: false, geocode: "Norges Hjemmefrontmuseum", notes: "Military: Norway's Resistance Museum and the Armed Forces Museum inside Akershus Fortress"}
  - {name: Oslo, lat: 59.911, lon: 10.752, type: overnight, lwh: false, geocode: "Oslo sentralstasjon", notes: Hotel / cabin}

# ---------------------------------------------------------------- Norway – southern fjords
- id: D05
  chapter: Fjords and mountain roads
  offset: 4
  title: Oslo → Haukeli
  description: "Into the mountains of Telemark: forested valleys via Kongsberg and Notodden, then Rv37 along the long, narrow Tinnsjø and up the steep Vestfjord valley to Rjukan, under the cone of Gaustatoppen (1,883 m). Past Vemork the road climbs onto open plateau with lakes, to the treeless Haukelifjell – expect snow patches in June."
  from: Oslo
  to: Haukeli
  target_km: 330
  overnight_type: wild camp
  country: NO
  points:
  - {name: Oslo, lat: 59.911, lon: 10.752, type: via, lwh: false, geocode: "Oslo sentralstasjon"}
  - {name: Museum of the Viking Age, lat: 59.90483, lon: 10.68413, type: poi, route: false, lwh: false, geocode: "Vikingskipshuset", notes: "Viking: the Oseberg, Gokstad and Tune ships on Bygdøy – rebuilt museum planned to open late 2027, so probably still closed in June; check"}
  - {name: Fram Museum, lat: 59.90336, lon: 10.69955, type: poi, route: false, lwh: false, geocode: "Frammuseet", notes: "Maritime: polar ships Fram and Gjøa; the Norwegian Maritime and Kon-Tiki museums are next door on Bygdøy"}
  - {name: Kongsberg, lat: 59.668, lon: 9.650, override: {lat: 59.65742, lon: 9.66108, reason: "moved 1.3 km onto the through-route to avoid a town-centre U-turn"}, type: via, lwh: false, geocode: "Kongsberg"}
  - {name: Heddal stave church, lat: 59.57956, lon: 9.17629, type: poi, route: false, lwh: false, geocode: "Heddal stavkyrkje", notes: "Norway's largest stave church (c. 1250), right on the E134"}
  - {name: Notodden, lat: 59.56, lon: 9.26, type: via, lwh: false, geocode: "Notodden"}
  - {name: Tinnoset, lat: 59.73, lon: 9.03, override: {lat: 59.72996, lon: 9.01905, reason: "snapped onto 37 (OSRM), was 0.61 km off"}, type: shape, lwh: false, road: "37", geocode: "Tinnoset", notes: Rv37 along Tinnsjå}
  - {name: Mæl, lat: 59.93, lon: 8.81, override: {lat: 59.92913, lon: 8.81133, reason: "snapped onto 37 (OSRM), was 0.12 km off"}, type: shape, lwh: false, road: "37", geocode: "Mæl, Tinn", notes: Rv37 along Tinnsjå}
  - {name: Rjukan, lat: 59.878, lon: 8.593, type: via, lwh: false, geocode: "Rjukan"}
  - {name: Vemork, lat: 59.87103, lon: 8.49372, type: poi, route: false, lwh: false, geocode: "Vemork, Tinn", notes: "Industrial Workers Museum in the heavy-water plant of the WWII sabotage, beside Rv37"}
  - {name: Rauland, lat: 59.70, lon: 8.05, type: via, lwh: false, geocode: "Rauland"}
  - {name: Haukeliseter, lat: 59.81, lon: 7.20, type: overnight, lwh: false, geocode: "Haukeliseter fjellstue", notes: "Mountain cabin (Haukeliseter) or wild camp on Haukelifjell"}

- id: D06
  offset: 5
  title: Haukeli → Lysebotn → Stavanger
  description: "The big mountain day of the south: down Setesdal along the Otra, then Suleskarvegen across a bare, lake-studded plateau with snow walls early in the season. Lysevegen crosses the same moonscape to Øygardstøl, then drops 900 m in 27 hairpins to Lysebotn. On the ferry out along the Lysefjord, Kjerag towers above the start and Preikestolen comes up on the right near the end."
  from: Haukeli
  to: Stavanger
  target_km: 230
  overnight_type: hotel
  country: NO
  seasonal: [suleskarvegen, lysevegen, lysefjord_ferry]
