    title: Kautokeino → Karesuando → Kiruna
    description: "South over the open plateau to the Finnish border and down the Könkämäeno river to Karesuando, where the E45 – the Inland Road – begins. Then Swedish Lapland proper: endless pine and bog, the Torne river and Jukkasjärvi with the Icehotel, to the mining town of Kiruna."
