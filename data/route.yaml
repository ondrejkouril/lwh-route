# Built into out/shortcut/ and shown on the itinerary page as a callout before that day.
shortcut:
  title: Fast way home – Via Baltica
  replaces_from: D21
  notes: Use it if Scandinavia costs you days. Same Helsinki–Tallinn ferry (many sailings a day, nothing else to book), then main roads through Riga, Kaunas and Warsaw.
  days:
  - id: S1
    offset: 0
    title: Helsinki → Tallinn → Riga
    description: "Morning ferry to Tallinn, then the Via Baltica south: flat farmland and forest, Pärnu bay and the Gulf of Riga coast past Ainaži to Riga."
