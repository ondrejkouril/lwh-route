    - {name: Kiruna, lat: 67.855, lon: 20.225, override: {lat: 67.84961, lon: 20.30625, reason: "Nominatim: new Kiruna town centre (moved east of the mine), was 3.5 km off"}, type: overnight, lwh: false, geocode: "Kiruna", notes: "Hotel. Iron-ore mine tours (LKAB) from the visitor centre; the town is being moved away from the mine"}
