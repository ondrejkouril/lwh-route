# ---------------------------------------------------------------- Norway – north to the Arctic
- id: D10
  chapter: North to the Arctic Circle and Lofoten
  offset: 9
  title: Kristiansund → Steinkjer
  description: "A transfer inland: Rv70 up the deep, waterfall-lined Sunndalen, then the E6 from Oppdal down the Gauldal valley to Trondheim – Nidaros Cathedral and the coloured wharves on the Nidelva. Then farmland along the Trondheimsfjord to Steinkjer."
  from: Kristiansund
  to: Steinkjer
  target_km: 380
  overnight_type: campsite cabin
  country: NO
  points:
  - {name: Kristiansund, lat: 63.110, lon: 7.728, type: via, lwh: false, geocode: "Kristiansund"}
  - {name: Sunndalsøra (Rv70), lat: 62.67564, lon: 8.56273, type: shape, lwh: false, notes: "Overland via Rv70 – avoids the E39 Halsa–Kanestraum ferry (point taken from the routed track)"}
  - {name: Oppdal (E6), lat: 62.60071, lon: 9.68465, type: shape, lwh: false, notes: "E6 Oppdal → Trondheim (point taken from the routed track)"}
  - {name: Trondheim, lat: 63.43, lon: 10.39, type: via, lwh: false, geocode: "Trondheim"}
  - {name: Nidaros Cathedral, lat: 63.42693, lon: 10.39691, type: poi, route: false, lwh: false, geocode: "Nidarosdomen", notes: "Scandinavia's largest medieval building"}
  - {name: Army Museum Trondheim (Rustkammeret), lat: 63.4258, lon: 10.39529, type: poi, route: false, lwh: false, geocode: "Rustkammeret, Trondheim", notes: "Military: army museum and resistance exhibition in the Archbishop's Palace, next to the cathedral"}
  - {name: Steinkjer, lat: 64.01, lon: 11.50, type: overnight, lwh: false, geocode: "Steinkjer", notes: Campsite cabin}

- id: D11
  offset: 10
  title: Steinkjer → Mo i Rana
  description: "The long E6 north through Namdalen and Helgeland: spruce and birch forest, wide salmon rivers, lakes and the first bare fells. Not a curvy day – make distance. Laksforsen waterfall beside the E6 before Mosjøen makes a good break, and Mosjøen's Sjøgata is a street of 19th-century wooden warehouses."
  from: Steinkjer
  to: Mo i Rana
  target_km: 400
  overnight_type: wild camp
  country: NO
  points:
  - {name: Steinkjer, lat: 64.01, lon: 11.50, type: via, lwh: false, geocode: "Steinkjer"}
  - {name: Trofors (E6), lat: 65.52742, lon: 13.38671, type: shape, lwh: false, notes: "Keeps Kurviger on the E6 rather than the ferry-laden coastal Fv17 (point taken from the routed track)"}
  - {name: Mosjøen, lat: 65.84, lon: 13.19, type: via, lwh: false, geocode: "Mosjøen"}
  - {name: Mo i Rana, lat: 66.31, lon: 14.14, type: overnight, lwh: false, geocode: "Mo i Rana", notes: Wild camp / cabin}

- id: D12
  offset: 11
  title: Mo i Rana → Reine (Lofoten)
  description: "The E6 climbs over Saltfjellet onto bare, windswept upland – the Arctic Circle Centre sits right on the line. Down through Saltdal to Saltstraumen, the world's strongest tidal current (it peaks every six hours – check the tide table), and Bodø. On the 3½-hour ferry the jagged wall of Lofoten grows on the horizon: stay on deck for the approach to Moskenes."
  from: Mo i Rana
  to: Reine
  target_km: 230
  overnight_type: campsite cabin
  country: NO
  notes: 'LWH: "up to the Arctic Circle".'
  points:
  - {name: Mo i Rana, lat: 66.31, lon: 14.14, type: via, lwh: false, geocode: "Mo i Rana"}
  - {name: Polarsirkelsenteret (Arctic Circle Centre), lat: 66.55, lon: 15.32, type: poi, lwh: true, lwh_conf: confirmed, geocode: "Polarsirkelsenteret", notes: LWH Arctic Circle}
  - {name: Saltstraumen, lat: 67.23, lon: 14.62, spur: short, type: poi, lwh: false, geocode: "Saltstraumen", notes: Tidal maelstrom}
  - {name: Norwegian Aviation Museum, lat: 67.27608, lon: 14.4137, type: poi, route: false, lwh: false, geocode: "Norsk Luftfartsmuseum", notes: "Military/aviation: Cold War jets, a U-2 and a Spitfire, 1 km off the route to the Bodø ferry"}
  - {name: Bodø ferry terminal, lat: 67.288, lon: 14.386, override: {lat: 67.28835, lon: 14.39415, reason: "snapped to OSM ferry terminal"}, type: ferry_start, ferry: bodo-moskenes, lwh: false, geocode: "Bodø ferjekai", notes: "≈3.5 h. Reserve in high season (critical in July)"}
  - {name: Moskenes ferry quay, lat: 67.90, lon: 13.06, type: ferry_end, ferry: bodo-moskenes, lwh: false, geocode: "Moskenes"}
  - {name: Norwegian Fishing Village Museum, lat: 67.88137, lon: 12.98206, type: poi, route: false, lwh: false, geocode: "Norsk Fiskeværsmuseum", notes: "Maritime: preserved fishing village at Å, the end of the E10, 6 km from Reine"}
  - {name: Reine, lat: 67.93, lon: 13.09, type: overnight, lwh: false, geocode: "Reine, Moskenes", notes: Rorbu cabin}

- id: D13
  offset: 12
  title: Reine → Svolvær (Lofoten)
  description: "Lofoten on the E10: the bridges at Hamnøy and Sakrisøy with the postcard view of Reine, white beaches at Ramberg and Flakstad, the side road to Nusfjord. Then green farmland at Leknes and Borg, and the Henningsvær side road with granite peaks straight out of the sea. Short distance, lots of stopping – a day for photos."
  from: Reine
  to: Svolvær
  target_km: 150
  overnight_type: campsite cabin
  country: NO
  notes: Easy day.
  points:
  - {name: Reine, lat: 67.93, lon: 13.09, type: via, lwh: false, geocode: "Reine, Moskenes"}
  - {name: Hamnøy, lat: 67.95, lon: 13.13, override: {lat: 67.9518, lon: 13.13541, reason: "snapped onto E 10 (OSRM), was 0.30 km off"}, type: shape, lwh: false, road: E 10, geocode: "Hamnøy", notes: E10}
  - {name: Flakstad church, lat: 68.10482, lon: 13.30625, override: {lat: 68.10259, lon: 13.30626, reason: "snapped onto E 10 (OSRM), was 0.25 km off"}, type: shape, lwh: false, road: E 10, geocode: "Flakstad kirke", notes: E10}
