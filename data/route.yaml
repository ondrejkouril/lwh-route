# ---------------------------------------------------------------- Finland
- id: D17
  chapter: Finnish forests and lakes
  offset: 16
  title: Rovaniemi → Suomussalmi (Raate)
  description: "Through the forest heart of Finland: Ranua, then the empty roads of Koillismaa and Kainuu – pine and spruce, bogs and lakes, very little traffic. North of Suomussalmi, the Silent People: a field of about a thousand scarecrows by the road. End on the Raate road, the Winter War battlefield, at Raatteen Portti and its memorial of stones."
  from: Rovaniemi
  to: Suomussalmi
  target_km: 330
  overnight_type: wild camp
  country: FI
  notes: Finnish–Russian border crossings are closed and the frontier zone needs a permit – stay on public roads to the museum.
  points:
  - {name: Arctic TreeHouse Hotel, lat: 66.53858, lon: 25.80188, type: via, lwh: false, geocode: "Arctic TreeHouse Hotel"}
  - {name: Ranua, lat: 65.93, lon: 26.52, override: {lat: 65.92784, lon: 26.51496, reason: "moved 0.3 km onto the through-route to avoid a town-centre U-turn"}, type: via, lwh: false, geocode: "Ranua"}
  - {name: Silent People (Hiljainen kansa), lat: 65.09294, lon: 28.90561, type: poi, lwh: true, lwh_conf: likely, geocode: "Hiljainen kansa", notes: LWH "Silent Art"}
  - {name: Suomussalmi (Ämmänsaari), lat: 64.89, lon: 28.91, type: via, lwh: false, geocode: "Ämmänsaari"}
  - {name: Raatteen Portti, lat: 64.84834, lon: 29.32720, type: overnight, lwh: true, lwh_conf: likely, geocode: "Raatteentie, Suomussalmi", notes: "Raatteen Portti Winter War museum (location confirmed by rider). Wild camp / cabin nearby"}

- id: D18
  offset: 17
  title: Suomussalmi → Koli
  description: "Quiet forest roads along the border region via Kuhmo and Nurmes, then Koli: the highest hills of eastern Finland, rising about 250 m above Lake Pielinen. The view from Ukko-Koli over the lake and its islands, best in the evening light, is a Finnish national landscape painted by the national-romantic artists."
  from: Suomussalmi
  to: Koli
  target_km: 280
  overnight_type: hotel
  country: FI
  notes: The old 488 km Raate → Savonlinna day, split at Koli.
  points:
  - {name: Raatteen Portti, lat: 64.84834, lon: 29.32720, type: via, lwh: true, lwh_conf: likely, geocode: "Raatteentie, Suomussalmi"}
  - {name: Kuhmo, lat: 64.13, lon: 29.52, type: via, lwh: false, geocode: "Kuhmo"}
  - {name: Nurmes, lat: 63.54, lon: 29.14, type: via, lwh: false, geocode: "Nurmes"}
  - {name: Koli (Ukko-Koli), lat: 63.09439, lon: 29.80886, type: overnight, lwh: false, geocode: "Ukko-Koli", notes: "Hotel Koli by the summit or a cabin at Loma-Koli; evening view over Lake Pielinen from Ukko-Koli"}

- id: D19
  offset: 18
  title: Koli → Punkaharju → Linnansaari
  description: "Through North Karelia's lakes to Punkaharju, where the ridge road follows a narrow pine-covered esker with water on both sides – ride it slowly. Then Olavinlinna, the 15th-century castle on an island in Savonlinna, and Rantasalmi pier for the boat to Linnansaari: rocky islands in Lake Haukivesi, home of the Saimaa ringed seal."
  from: Koli
  to: Linnansaari
  target_km: 280
  overnight_type: wild camp
  country: FI
  notes: Punkaharju ridge road and Olavinlinna, then the bike stays at the pier in Rantasalmi (Porosalmi); water taxi to Linnansaari NP. Optional log-rolling if available.
  points:
  - {name: Koli (Ukko-Koli), lat: 63.09439, lon: 29.80886, type: via, lwh: false, geocode: "Ukko-Koli"}
  - {name: Joensuu, lat: 62.60, lon: 29.76, type: via, lwh: false, geocode: "Joensuu"}
